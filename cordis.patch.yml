# dsh-kanban 的 bundle 层：安装进 profile 后由 dsh 加载。
# 每个条目对应一个插件模块；后层按 id 覆盖前层，覆盖整行 config 而非深合并。
#
# 配置说明（工作区模型）：
#  - dataDir: 本地缓存目录（issues/meta/links）。空字符串 => 用默认
#    `~/.dsh/kanban`（可用环境变量 KANBAN_DATA_DIR 覆盖）。
#  - allowSelfSigned: GitLab 私服/自签名证书时信任 TLS（默认 true）。
#  - jira:  全局 Jira host(baseUrl) + apiToken。所有工作区在未覆盖时继承。
#  - gitlab: 全局 GitLab host(baseUrl) + apiToken。所有工作区在未覆盖时继承。
#  - projects: 按工作区 id 的覆盖列表。每个 DSH 工作区自动映射成一个看板项目
#    （id=工作区id，name=工作区title，localRepo 目录默认=工作区 path）；此处只写
#    与全局不同/可覆盖的差异项（Jira projectKey+jql、GitLab project 路径、display
#    name），未写的项目完全继承全局。切换项目跟随当前会话的工作区，无全局 activeProject。
#
# 这些配置既可以在这里写死，也可以在 GUI 设置 → 插件 → Configurable 里点击
# 修改（浏览器半边 src/client/，经 settings 命名空间 dsh-kanban 写入用户设置文档，
# host 半边实时读取）。注意：web 设置面板的可见性受 harness 的
# WEB_SETTINGS_NAMESPACES 白名单影响，仅影响卡片可编辑性，不影响工具读取配置。
- insert:
    - id: dsh-kanban
      name: dsh-kanban
      config:
        dataDir: ''
        allowSelfSigned: true
        verbose: false
        jira:
          baseUrl: ''
          apiToken: ''
        gitlab:
          baseUrl: ''
          apiToken: ''
        projects: []
